<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416"><rect width="1200" height="416" fill="#F4F0E6"/><text x="40" y="38" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#11120F" letter-spacing="2">01 / THE LAB</text><path d="M40 60H1160" stroke="#11120F"/><text x="40" y="124" font-family="Georgia, Times New Roman, serif" font-size="57" fill="#FF4D00" >Curiosity into software.</text><text x="40" y="166" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11120F" >A space for independent products, experiments and thoughtful engineering.</text><text x="40" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF4D00" >01</text><path d="M40 251H380" stroke="#11120F"/><text x="40" y="295" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#11120F" >Explore</text><text x="40" y="334" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#11120F" >Find a problem worth solving.</text><text x="40" y="377" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#11120F" letter-spacing="1.5">QUESTIONS / IDEAS</text><text x="382" y="295" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FF4D00" >→</text><text x="430" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF4D00" >02</text><path d="M430 251H770" stroke="#11120F"/><text x="430" y="295" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#11120F" >Build</text><text x="430" y="334" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#11120F" >Turn the idea into working software.</text><text x="430" y="377" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#11120F" letter-spacing="1.5">PRODUCT / ENGINEERING</text><text x="772" y="295" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FF4D00" >→</text><text x="820" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF4D00" >03</text><path d="M820 2